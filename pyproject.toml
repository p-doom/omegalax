[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omegalax"
version = "0.1.0"
description = "JAX-based VLM training codebase scaffold."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "absl-py",
  "array-record",
  "etils",
  "flax>0.12.0",
  "jax[cuda12]",
  "jax-triton",
  "nvidia-cudnn-cu12==9.18.1.3",
  "jaxtyping",
  "optax",
  "orbax-checkpoint",
  "Pillow",
  # From the index, pinned exactly to the version prime-rl is on, so training and
  # rollout share one renderer. It used to come from a path source into a personal
  # clone of prime-rl, at that clone's pre-#44 layout: it resolved only while the
  # clone stayed stale, and `uv.lock` recorded the dependency nowhere at all.
  "renderers==0.1.9.dev1",
  "safetensors",
  "tokamax @ git+https://github.com/p-doom/tokamax.git@nested-mask", # change after fix has been upstreamed
  "transformers",
  "triton", 
  "huggingface-hub",
  "wandb",
  "grain>=0.2.16",
]

[project.optional-dependencies]
torch-tests = [
  "torch==2.10.* ; platform_system == \"Linux\"",
]

[tool.uv]
override-dependencies = ["nvidia-cudnn-cu12==9.18.1.3"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["omegalax"]

[dependency-groups]
dev = [
    "setuptools<81",
    "tensorboard>=2.20.0",
    "xprof>=2.22.0",
]

[tool.ruff]
# Matches the codebase: p99 line length ~107, so 100 avoids gratuitous wrapping.
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.format]
# Ruff's defaults (double quotes, 4-space indent). The pre-commit hook runs
# `ruff format --check`; run `ruff format` (or `uvx ruff format`) to fix.
docstring-code-format = false
