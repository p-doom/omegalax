[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omegalax"
version = "0.1.0"
description = "JAX-based VLM training codebase scaffold."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "absl-py",
  "array-record",
  "etils",
  "flax>0.12.0",
  "jax[cuda12]",
  "jax-triton",
  "nvidia-cudnn-cu12==9.18.1.3",
  "jaxtyping",
  "optax",
  "orbax-checkpoint",
  "Pillow",
  # Pinned exactly to the version prime-rl is on, so training and rollout share one
  # renderer.
  "renderers==0.1.9.dev1",
  # Floored at the version whose `save_file` stride semantics the exporter is written
  # against.
  "safetensors>=0.8.0",
  # Pinned to a commit, not to the branch it tracks: a branch ref lets
  # `uv lock --upgrade` move the attention kernels under us. Repoint when the fix is
  # upstreamed.
  "tokamax @ git+https://github.com/p-doom/tokamax.git@d81bc23bc80f01728984bcda5161ff2569cd7cc5",
  # 5.4.0 gave Qwen3VLMoeTextConfig `attribute_map = {"num_experts":
  # "num_local_experts"}`, so `to_dict()` stops writing the `text_config.num_experts`
  # the Qwen3-VL MoE loader requires and every config on the Hub carries.
  "transformers<5.4",
  "triton", 
  "huggingface-hub",
  "wandb",
  "grain>=0.2.16",
]

[project.optional-dependencies]
torch-tests = [
  "torch==2.10.* ; platform_system == \"Linux\"",
  # transformers resolves Qwen3VLVideoProcessor through a torchvision backend and
  # raises on the import when it is absent, so the collator parity test cannot
  # build the reference processor without it.
  "torchvision ; platform_system == \"Linux\"",
]

[tool.uv]
override-dependencies = ["nvidia-cudnn-cu12==9.18.1.3"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["omegalax"]

[dependency-groups]
dev = [
    "pytest>=8",
    "setuptools<81",
    "tensorboard>=2.20.0",
    "xprof>=2.22.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.format]
# Ruff's defaults (double quotes, 4-space indent). The pre-commit hook runs
# `ruff format --check`; run `ruff format` (or `uvx ruff format`) to fix.
docstring-code-format = false
