[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omegalax"
version = "0.1.0"
description = "JAX-based VLM training codebase scaffold."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "absl-py",
  "array-record",
  "etils",
  "flax>0.12.0",
  "jax[cuda12]",
  "jax-triton",
  # Pin cuDNN >= 9.18.1 (Ampere/Ada THD/ragged packed attention support); jax allows
  # <10.0,>=9.8, so this is a clean in-range bump of the otherwise-transitive wheel.
  # Lets the vision encoder's packed cuDNN kernel run on A100 (sm80); pairs with the
  # omegalax.compat.cudnn_ampere_packed gate relaxation. Keeps the stack self-contained
  # (no system-CUDA LD_LIBRARY_PATH), so no system cuBLAS shadowing.
  "nvidia-cudnn-cu12==9.18.1.3",
  "jaxtyping",
  "optax",
  "orbax-checkpoint",
  "Pillow",
  "safetensors",
  "tokamax @ git+https://github.com/p-doom/tokamax.git@nested-mask", # change after fix has been upstreamed
  "transformers",
  "triton", 
  "huggingface-hub",
  "wandb",
  "grain>=0.2.16",
]

[project.optional-dependencies]
torch-tests = [
  "torch==2.10.* ; platform_system == \"Linux\"",
]

[tool.uv]
# torch==2.10 hard-pins nvidia-cudnn-cu12==9.10.2.21, which conflicts with our
# >=9.18.1 requirement for Ampere packed attention. torch-tests is an optional
# reference-comparison extra (not used for training) and cuDNN 9.x is backward
# compatible, so force 9.18.1.3 across the whole graph (torch included).
override-dependencies = ["nvidia-cudnn-cu12==9.18.1.3"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["omegalax"]

[dependency-groups]
dev = [
    "setuptools<81",
    "tensorboard>=2.20.0",
    "xprof>=2.22.0",
]

[tool.ruff]
# Matches the codebase: p99 line length ~107, so 100 avoids gratuitous wrapping.
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.format]
# Ruff's defaults (double quotes, 4-space indent). The pre-commit hook runs
# `ruff format --check`; run `ruff format` (or `uvx ruff format`) to fix.
docstring-code-format = false
