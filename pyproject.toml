[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omegalax"
version = "0.1.0"
description = "JAX-based VLM training codebase scaffold."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "absl-py",
  "array-record",
  "etils",
  "flax>0.12.0",
  "jax[cuda12]",
  "jax-triton",
  "nvidia-cudnn-cu12==9.18.1.3",
  "jaxtyping",
  "optax",
  "orbax-checkpoint",
  "Pillow",
  # From the index, pinned exactly to the version prime-rl is on, so training and
  # rollout share one renderer. It used to come from a path source into a personal
  # clone of prime-rl, at that clone's pre-#44 layout: it resolved only while the
  # clone stayed stale, and `uv.lock` recorded the dependency nowhere at all.
  "renderers==0.1.9.dev1",
  # 0.8.0 stopped honouring strides in save_file (it copies straight off the raw
  # pointer), which silently changed what a non-contiguous view serialized to.
  # The exporter no longer relies on either behaviour, but floor it at the version
  # whose semantics we write against so the change cannot happen under us again.
  "safetensors>=0.8.0",
  # Pinned to a commit, not the `nested-mask` branch it was tracking: a branch ref
  # lets `uv lock --upgrade` move the attention kernels under us, and this is the
  # rev every measurement in the repo was taken against. Repoint when the fix is
  # upstreamed.
  "tokamax @ git+https://github.com/p-doom/tokamax.git@d81bc23bc80f01728984bcda5161ff2569cd7cc5",
  "transformers==5.15.1",
  "triton", 
  "huggingface-hub",
  "wandb",
  "grain>=0.2.16",
]

[project.optional-dependencies]
torch-tests = [
  "torch==2.10.* ; platform_system == \"Linux\"",
  # transformers resolves Qwen3VLVideoProcessor through a torchvision backend and
  # raises on the import when it is absent, so the collator parity test cannot
  # build the reference processor without it.
  "torchvision ; platform_system == \"Linux\"",
]

[tool.uv]
override-dependencies = ["nvidia-cudnn-cu12==9.18.1.3"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["omegalax"]

[dependency-groups]
dev = [
    "pytest>=8",
    "setuptools<81",
    "tensorboard>=2.20.0",
    "xprof>=2.22.0",
]

[tool.ruff]
# Matches the codebase: p99 line length ~107, so 100 avoids gratuitous wrapping.
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.format]
# Ruff's defaults (double quotes, 4-space indent). The pre-commit hook runs
# `ruff format --check`; run `ruff format` (or `uvx ruff format`) to fix.
docstring-code-format = false
