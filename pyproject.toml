[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omegalax"
version = "0.1.0"
description = "JAX-based VLM training codebase scaffold."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "absl-py",
  "array-record",
  "etils",
  "flax>0.12.0",
  "jax[cuda12]",
  "jax-triton",
  "nvidia-cudnn-cu12==9.18.1.3",
  "nvidia-nccl-cu12==2.28.3",
  "jaxtyping",
  "optax",
  "orbax-checkpoint",
  "Pillow",
  "safetensors>=0.8.0",
  "tokamax @ git+https://github.com/p-doom/tokamax.git@d81bc23bc80f01728984bcda5161ff2569cd7cc5",
  "transformers==5.15.1",
  "triton", 
  "huggingface-hub",
  "wandb",
  "grain>=0.2.16",
]

[project.optional-dependencies]
torch-tests = [
  "torch==2.10.* ; platform_system == \"Linux\"",
  "torchvision ; platform_system == \"Linux\"",
]

[tool.uv]
override-dependencies = ["nvidia-cudnn-cu12==9.18.1.3", "nvidia-nccl-cu12==2.28.3"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["omegalax"]

[dependency-groups]
dev = [
    "jinja2>=3.1.6",
    "setuptools<81",
    "tensorboard>=2.20.0",
    "xprof>=2.22.0",
]

[tool.ruff]
# Matches the codebase: p99 line length ~107, so 100 avoids gratuitous wrapping.
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.format]
# Ruff's defaults (double quotes, 4-space indent). The pre-commit hook runs
# `ruff format --check`; run `ruff format` (or `uvx ruff format`) to fix.
docstring-code-format = false
